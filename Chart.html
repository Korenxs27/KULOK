    />

    <title>Kue Balok</title>
    <link rel="icon" type="image/x-icon" href="img/Logo.jpeg" />

        <div class="px-40 flex flex-1 justify-center py-5">

            class="layout-content-container flex flex-col max-w-[960px] flex-1"
          >
            <div class="flex flex-wrap gap-2 p-4">
              <a
                class="text-[#97734e] text-base font-medium leading-normal"
                href="Menu.html"
                >Menu</a
              >
              <span class="text-[#97734e] text-base font-medium leading-normal"
                >/</span
              >
              <span class="text-[#1b140e] text-base font-medium leading-normal"
                >Kue Balok</span
              >
            </div>
          <div
            class="layout-content-container flex flex-col max-w-[960px] flex-1"

                class="text-[#1b140e] tracking-light text-[32px] font-bold leading-tight min-w-72"

                <a href="Checkout.html"
